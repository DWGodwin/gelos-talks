title: Slides
author: Denys Godwin
version: 0.2.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      theme: [default, slides.scss]
      width: 1600
      height: 900
      slide-number: c/t
      progress: true
      hash: true
      controls: false
      chalkboard: false
      # Countdown bar for timed talks; it only appears when auto-slide is set
      include-after-body: countdown.html
